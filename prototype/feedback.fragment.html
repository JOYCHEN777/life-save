<div id="life-save-tactile" class="viz-dotted-background" data-strength="crisp">
  <section class="st-app" aria-label="随手存档即时反馈体验">

      </div>
      <div class="st-button-wrap">

      </div>

      <div class="st-actions"><button type="button" class="st-link cursor-interaction" data-action="history" aria-controls="st-history-list" aria-pressed="false">全部记录（0）</button><button type="button" class="st-link cursor-interaction" data-action="undo" hidden>撤销最近一次</button></div>
      <section class="st-calendar-section" aria-label="按天查看记录日历">
        <div class="st-calendar-heading"><span class="st-calendar-title">记录日历</span><span class="st-calendar-summary" data-part="calendar-summary">近 12 周</span></div>

          <button type="button" class="cursor-interaction" data-action="previous-period" aria-label="查看前12周"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
          <span class="st-calendar-range" data-part="calendar-range"></span>
          <button type="button" class="cursor-interaction" data-action="next-period" aria-label="查看后12周" disabled><i data-lucide="chevron-right" aria-hidden="true"></i></button>
        </div>
        <div class="st-calendar-scroll"><div class="st-calendar-chart">
          <div class="st-months" data-part="calendar-months" aria-hidden="true"></div>
          <div class="st-days" data-part="calendar-days" role="group" aria-label="每天一个方格，按周排列"></div>
        </div></div>
        <div class="st-calendar-legend" aria-label="灰色表示未记录，绿色表示有记录"><span class="st-swatch" aria-hidden="true"></span>未记录<span class="st-swatch st-swatch-filled" aria-hidden="true"></span>有记录</div>

      <div class="st-status-icon" aria-hidden="true"><span data-part="status-idle"><i data-lucide="bookmark"></i></span><span data-part="status-done" hidden><i data-lucide="check-check"></i></span></div>
      <div><div class="st-status-title" data-part="status-title">点一下，这件事就记住了</div><div class="st-status-desc" data-part="status-desc">下次想知道，打开就能看见。</div></div>
    </div>
    <div class="st-preview">记录保存在当前浏览器 · 清除浏览器数据会丢失</div>
  </section>

<script>
(() => {
  const root = document.getElementById('life-save-tactile');
  const part = (name) => root.querySelector('[data-part="' + name + '"]');
  const action = (name) => root.querySelector('[data-action="' + name + '"]');
  const record = action('record');
  const history = action('history');
  const sound = action('sound');
  const list = root.querySelector('#st-history-list');
  const burst = root.querySelector('.st-burst');
  const settings = { strength: 'crisp', sound: false };
  const state = { entries: [], historyOpen: false };
  let calendarPage = 0;
  let selectedDay = null;
  let calendarSignature = '';
  const cooldownMs = 800;
  let writing = false;
  let readyAt = 0;
  let feedbackTimer;
  let message = '';
  let storageError = '';
  let incompatibleState = false;
  let audioContext;
  let audioUnavailable = false;
  let playingAudio = false;
  const particles = [[-99,-47],[-73,-79],[-41,-91],[0,-101],[44,-90],[77,-72],[99,-41],[-94,17],[91,21],[-54,33],[55,35],[0,-66]];
  particles.forEach(([x,y], i) => {
    const dot = document.createElement('span');
    dot.className = 'st-bit';
    dot.style.setProperty('--dx', x + 'px');
    dot.style.setProperty('--dy', y + 'px');
    dot.style.setProperty('--dr', (i % 2 ? 100 : -70) + 'deg');
    burst.append(dot);
  });
  function applySaved(saved) {
    const value = saved && saved.privateContent;
    if (!value) return;
    // The old boolean represented a fixed, fictional example, not a real event.
    if (value.demo === 'life-save-tactile-v1') {
      settings.sound = value.sound === true;
      settings.strength = value.strength === 'soft' ? 'soft' : 'crisp';
      return;
    }
    if (value.demo !== 'life-save-records-v2' || !Array.isArray(value.entries)
      || value.entries.some(entry => !entry || typeof entry.id !== 'string'
        || typeof entry.at !== 'string' || !Number.isFinite(Date.parse(entry.at)))
      || new Set(value.entries.map(entry => entry.id)).size !== value.entries.length) {
      incompatibleState = true;
      storageError = '现有记录格式无法读取，已保留原数据，暂停写入。';
      return;
    }
    state.entries = value.entries.map(({ id, at }) => ({ id, at }));
    incompatibleState = false;
    storageError = '';
    settings.sound = value.sound === true;
    settings.strength = value.strength === 'soft' ? 'soft' : 'crisp';
  }
  async function persistEntries(entries) {
    if (!window.openai || typeof window.openai.setWidgetState !== 'function') {
      throw new Error('Storage unavailable');
    }
    // Wait for the standalone page's local-storage receipt before showing success.
    await window.openai.setWidgetState({
      modelContent: { demo: '生活记录原型', feedback: settings.strength, sound: settings.sound },
      privateContent: { demo: 'life-save-records-v2', entries, ...settings },
    });
  }
  function formatTime(at) {
    return new Intl.DateTimeFormat('zh-CN', {
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23',
    }).format(new Date(at));
  }
  function refreshElapsed() {
    const latest = state.entries[0];
    if (!latest) {
      part('elapsed').textContent = '还没有记录';
      part('stamp').textContent = '记录后，这里会显示上次时间。';
      return;
    }
    const minutes = Math.floor(Math.max(0, Date.now() - Date.parse(latest.at)) / 60000);
    const hours = Math.floor(minutes / 60);
    const days = Math.floor(hours / 24);
    part('elapsed').textContent = minutes < 1 ? '刚刚'
      : minutes < 60 ? minutes + ' 分钟'
      : hours < 24 ? hours + ' 小时 ' + (minutes % 60) + ' 分钟'
      : days + ' 天 ' + (hours % 24) + ' 小时';
    part('stamp').textContent = formatTime(latest.at);
  }
  // Calendar calculations use local dates and calendar arithmetic, including DST.
  function localDayKey(value) {
    const date = value instanceof Date ? value : new Date(value);
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
  }
  function moveLocalDay(date, days) {
    return new Date(date.getFullYear(), date.getMonth(), date.getDate() + days, 12);
  }
  function calendarModel(entries, now, page) {
    const today = moveLocalDay(now, 0);
    const weekStart = moveLocalDay(today, -today.getDay());
    const start = moveLocalDay(weekStart, -77 - page * 84);
    const end = moveLocalDay(start, 83);
    const buckets = new Map();
    for (const entry of entries) {
      const key = localDayKey(entry.at);
      if (!buckets.has(key)) buckets.set(key, []);
      buckets.get(key).push(entry);
    }
    const todayKey = localDayKey(today);
    const days = Array.from({ length: 84 }, (_, offset) => {
      const date = moveLocalDay(start, offset);
      const key = localDayKey(date);
      return { date, key, count: (buckets.get(key) || []).length, future: key > todayKey };
    });
    return { start, end, todayKey, days, buckets, activeDays: days.filter(day => !day.future && day.count > 0).length };
  }
  // Calendar UI derives from the existing records; it never rewrites saved entries.
  function renderHeatmap() {
    const model = calendarModel(state.entries, new Date(), calendarPage);
    const lastVisibleDay = calendarPage === 0 ? model.todayKey : localDayKey(model.end);
    if (!selectedDay || selectedDay < localDayKey(model.start) || selectedDay > lastVisibleDay) selectedDay = lastVisibleDay;
    part('calendar-summary').textContent = (calendarPage === 0 ? '近 12 周' : '12 周') + ' · ' + model.activeDays + ' 天有记录';
    const rangeDate = new Intl.DateTimeFormat('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' });
    const rangeEnd = calendarPage === 0 ? new Date() : model.end;
    part('calendar-range').textContent = rangeDate.format(model.start) + ' — ' + rangeDate.format(rangeEnd);
    action('next-period').disabled = calendarPage === 0;
    const days = part('calendar-days');
    const signature = calendarPage + '|' + model.todayKey + '|' + selectedDay + '|' + model.days.map(day => day.count).join(',');
    if (signature !== calendarSignature) {
      const previousPage = calendarSignature.split('|')[0];
      const focusedDay = days.querySelector('button:focus')?.dataset.day;
      days.replaceChildren();
      const months = part('calendar-months');
      months.replaceChildren();
      ['日', '一', '二', '三', '四', '五', '六'].forEach((label, row) => {
        const mark = document.createElement('span');
        mark.className = 'st-weekday';
        mark.textContent = label;
        mark.style.gridColumn = '1';
        mark.style.gridRow = String(row + 1);
        mark.setAttribute('aria-hidden', 'true');
        days.append(mark);
      });
      const longDate = new Intl.DateTimeFormat('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
      model.days.forEach((day, offset) => {
        const week = Math.floor(offset / 7);
        const showMonth = week === 0
          ? day.date.getMonth() === model.days[7].date.getMonth()
          : day.date.getMonth() !== model.days[offset - 7].date.getMonth();
        if (offset % 7 === 0 && showMonth) {
          const label = document.createElement('span');
          label.textContent = (day.date.getMonth() + 1) + '月';
          label.style.gridColumn = (week + 2) + ' / span ' + Math.min(2, 12 - week);
          months.append(label);
        }
        const cell = document.createElement(day.future ? 'span' : 'button');
        cell.className = day.future ? 'st-day-future' : 'st-day cursor-interaction';
        cell.style.gridColumn = String(week + 2);
        cell.style.gridRow = String(offset % 7 + 1);
        if (day.future) cell.setAttribute('aria-hidden', 'true');
        else {
          cell.type = 'button';
          cell.dataset.day = day.key;
          cell.dataset.count = String(day.count);
          cell.setAttribute('aria-label', longDate.format(day.date) + '，' + day.count + ' 条记录');
          cell.title = longDate.format(day.date) + ' · ' + day.count + ' 条记录';
          cell.setAttribute('aria-pressed', String(day.key === selectedDay && !state.historyOpen));
          if (day.key === model.todayKey) cell.setAttribute('aria-current', 'date');
        }
        days.append(cell);
      });
      calendarSignature = signature;
      if (focusedDay) days.querySelector('[data-day="' + focusedDay + '"]')?.focus({ preventScroll: true });
      if (previousPage !== String(calendarPage)) {
        const viewport = root.querySelector('.st-calendar-scroll');
        viewport.scrollLeft = viewport.scrollWidth;
      }
    }
    // The all-records switch may change without changing dates or record counts.
    days.querySelectorAll('button[data-day]').forEach(cell => cell.setAttribute('aria-pressed', String(cell.dataset.day === selectedDay && !state.historyOpen)));
    const selectedEntries = state.historyOpen ? state.entries : (model.buckets.get(selectedDay) || []);
    const selectedDate = model.days.find(day => day.key === selectedDay).date;
    const selectedLabel = new Intl.DateTimeFormat('zh-CN', { month: 'long', day: 'numeric' }).format(selectedDate);
    part('day-title').textContent = state.historyOpen ? '全部记录 · ' + state.entries.length + ' 条' : selectedLabel + (selectedDay === model.todayKey ? ' · 今天' : '') + ' · ' + selectedEntries.length + ' 条记录';
    list.replaceChildren();
    if (!selectedEntries.length) {
      const empty = document.createElement('li');
      empty.className = 'st-history-empty';
      empty.textContent = state.historyOpen ? '还没有记录。' : '这一天没有记录。';
      list.append(empty);
    }
    selectedEntries.forEach(entry => {
      const item = document.createElement('li');
      const time = document.createElement('time');
      time.dateTime = entry.at;
      time.textContent = state.historyOpen ? formatTime(entry.at) : new Intl.DateTimeFormat('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).format(new Date(entry.at));
      const label = document.createElement('span');
      label.textContent = '服药记录';
      item.append(time, label);
      list.append(item);
    });
  }
  function render() {
    root.dataset.strength = settings.strength;
    const hasEntries = state.entries.length > 0;
    const cooling = Date.now() < readyAt;
    refreshElapsed();
    part('record-label').textContent = writing ? '正在保存…' : cooling ? '这次记好了' : hasEntries ? '再记一次' : '我已服药，记一下';
    part('plus').hidden = cooling;
    part('check').hidden = !cooling;
    record.disabled = writing || cooling || incompatibleState;
    action('undo').hidden = !hasEntries;
    action('undo').disabled = writing || incompatibleState;
    part('status-idle').hidden = hasEntries;
    part('status-done').hidden = !hasEntries;
    part('status-title').textContent = message || (hasEntries ? '上次的事，已经记住了。' : '点一下，这件事就记住了');
    part('status-desc').textContent = hasEntries ? '本机共 ' + state.entries.length + ' 条记录' : '下次想知道，打开就能看见。';
    part('error').hidden = !storageError;
    part('error').textContent = storageError;
    part('sound-label').textContent = audioUnavailable ? '音效不可用' : settings.sound ? '音效 开' : '音效 关';
    sound.setAttribute('aria-pressed', String(settings.sound));
    sound.setAttribute('aria-label', audioUnavailable ? '音效不可用，点击重试' : settings.sound ? '关闭音效' : '开启音效');
    history.setAttribute('aria-pressed', String(state.historyOpen));
    history.textContent = state.historyOpen ? '返回按天查看' : '全部记录（' + state.entries.length + '）';
    renderHeatmap();
  }
  async function playSound() {
    if (!settings.sound || playingAudio) return;
    playingAudio = true;
    try {
      const Audio = window.AudioContext || window.webkitAudioContext;
      if (!Audio) throw new Error('Audio unavailable');
      if (!audioContext || audioContext.state === 'closed') audioContext = new Audio();
      if (audioContext.state === 'suspended') await audioContext.resume();
      if (!settings.sound) return;
      if (audioContext.state !== 'running') throw new Error('Audio unavailable');
      const now = audioContext.currentTime;
      [[740,0,.07],[1110,.045,.12]].forEach(([hz,delay,duration]) => {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(hz, now + delay);
        gain.gain.setValueAtTime(0, now + delay);
        gain.gain.linearRampToValueAtTime(.055, now + delay + .006);
        gain.gain.exponentialRampToValueAtTime(.0001, now + delay + duration);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start(now + delay);
        osc.stop(now + delay + duration + .01);
        osc.onended = () => { osc.disconnect(); gain.disconnect(); };
      });
    } catch (_) { audioUnavailable = true; settings.sound = false; render(); }
    finally { playingAudio = false; }
  }
  function feedback() {
    root.classList.remove('is-playing');
    void root.offsetWidth;
    root.classList.add('is-playing');
    void playSound();
  }
  record.addEventListener('click', async () => {
    if (writing || Date.now() < readyAt || incompatibleState) return;
    const entry = { id: crypto.randomUUID(), at: new Date().toISOString() };
    const next = [entry, ...state.entries];
    writing = true;
    storageError = '';
    message = '';
    render();
    try {
      await persistEntries(next);
      state.entries = next;
      calendarPage = 0;
      selectedDay = localDayKey(entry.at);
      state.historyOpen = false;
      message = '这次也记住了。';
      readyAt = Date.now() + cooldownMs;
      render();
      feedback();
      clearTimeout(feedbackTimer);
      feedbackTimer = setTimeout(() => {
        readyAt = 0;
        root.classList.remove('is-playing');
        render();
      }, cooldownMs);
    } catch (_) {
      storageError = '保存失败，本次没有新增记录。请检查浏览器存储后重试。';
    } finally {
      writing = false;
      render();
    }
  });
  action('undo').addEventListener('click', async () => {
    if (writing || !state.entries.length || incompatibleState) return;
    clearTimeout(feedbackTimer);
    root.classList.remove('is-playing');
    readyAt = 0;
    writing = true;
    storageError = '';
    const next = state.entries.slice(1);
    render();
    try {
      await persistEntries(next);
      state.entries = next;
      message = next.length ? '已撤销最近一次，之前的记录还在。' : '已撤销最近一次。';
    } catch (_) {
      storageError = '撤销未保存，原记录已保留，请重试。';
    } finally {
      writing = false;
      render();
    }
  });
  history.addEventListener('click', () => { state.historyOpen = !state.historyOpen; render(); });
  part('calendar-days').addEventListener('click', event => {
    const day = event.target.closest('button[data-day]');
    if (!day) return;
    selectedDay = day.dataset.day;
    state.historyOpen = false;
    render();
  });
  action('previous-period').addEventListener('click', () => { calendarPage += 1; selectedDay = null; state.historyOpen = false; render(); });
  action('next-period').addEventListener('click', () => { calendarPage = Math.max(0, calendarPage - 1); selectedDay = null; state.historyOpen = false; render(); });
  sound.addEventListener('click', () => { audioUnavailable = false; settings.sound = !settings.sound; render(); });
  applySaved(window.openai && window.openai.widgetState);
  render();
  window.addEventListener('openai:set_globals', (event) => {
    const globals = event.detail && event.detail.globals;
    if (!writing && globals && Object.prototype.hasOwnProperty.call(globals, 'widgetState')) { applySaved(globals.widgetState); render(); }
  });
  setInterval(() => { refreshElapsed(); renderHeatmap(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root.querySelector('.st-app'), onChange: render });
    tweak.addSelect(settings, 'strength', { label: '反馈力度', options: [{ label: '清脆弹跳', value: 'crisp' }, { label: '轻快收敛', value: 'soft' }] });
  }
})();
</script>
